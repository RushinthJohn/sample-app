name: Deploy to Production (Manual)

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag/Version to deploy (e.g., 1.0.0.build.1)"
                required: true
                type: string
            namespace:
                description: "Kubernetes namespace"
                required: false
                default: "ascintra"
                type: string

env:
    AWS_REGION: ${{ secrets.AWS_REGION }}
    ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
    deploy-to-staging:
        runs-on: ubuntu-latest
        environment:
            name: staging
            url: https://ascintra.yourdomain.com

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.tag }}

            - name: Validate tag format
              run: |
                  TAG="${{ github.event.inputs.tag }}"
                  if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.build\.[0-9]+$ ]]; then
                    echo "❌ Invalid tag format. Expected: x.x.x.build.x (e.g., 1.0.0.build.1)"
                    exit 1
                  fi
                  echo "✅ Valid tag format: $TAG"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Update kubeconfig for production
              run: |
                  echo "✅ Connected to production EKS cluster: ${{ secrets.EKS_CLUSTER_NAME }}"

